<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Protocol Scout — BOBOSYN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #050505;
      color: #f5f5f5;
    }

    header {
      border-bottom: 1px solid #222;
      padding: 22px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .by {
      color: #777;
      font-size: 13px;
      margin-left: 8px;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 90px 24px;
    }

    .hero {
      text-align: center;
      margin-bottom: 60px;
    }

    .hero h1 {
      font-size: 64px;
      margin: 0 0 18px;
      letter-spacing: -0.04em;
    }

    .hero p {
      color: #888;
      font-size: 18px;
    }

    .search {
      max-width: 700px;
      margin: 35px auto 0;
      display: flex;
      gap: 10px;
    }

    .search input {
      flex: 1;
      padding: 17px 18px;
      background: #111;
      border: 1px solid #333;
      color: white;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .search input:focus {
      border-color: #666;
    }

    .search button {
      padding: 0 25px;
      background: white;
      color: black;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .search button:hover {
      opacity: 0.85;
    }

    #status {
      text-align: center;
      color: #777;
      margin: 30px 0;
    }

    #result {
      margin-top: 50px;
    }

    .protocol-header {
      margin-bottom: 35px;
    }

    .protocol-header h2 {
      font-size: 36px;
      margin-bottom: 8px;
    }

    .protocol-header p {
      color: #777;
      margin: 0;
    }

    .section {
      border-top: 1px solid #222;
      padding: 30px 0;
    }

    .section h3 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #888;
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .card {
      background: #0d0d0d;
      border: 1px solid #1e1e1e;
      border-radius: 10px;
      padding: 20px;
      min-height: 90px;
    }

    .label {
      color: #666;
      font-size: 12px;
      margin-bottom: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .value {
      font-size: 18px;
      line-height: 1.5;
      word-break: break-word;
    }

    .big-value {
      font-size: 25px;
      font-weight: 600;
    }

    .positive {
      color: #8ee28e;
    }

    .negative {
      color: #ff8585;
    }

    .pending {
      color: #666;
    }

    .links a {
      color: white;
      text-decoration: none;
      border-bottom: 1px solid #444;
    }

    .links a:hover {
      border-color: white;
    }

    footer {
      border-top: 1px solid #222;
      margin-top: 100px;
      padding: 30px;
      text-align: center;
      color: #555;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      header {
        padding: 18px 20px;
      }

      main {
        padding: 60px 18px;
      }

      .hero h1 {
        font-size: 44px;
      }

      .search {
        flex-direction: column;
      }

      .search button {
        height: 50px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div>
    <span class="brand">BOBOSYN</span>
    <span class="by">Protocol Scout</span>
  </div>
</header>

<main>

  <section class="hero">
    <h1>Scout. Research. Understand.</h1>

    <p>
      AI-powered Web3 protocol research.
    </p>

    <div class="search">
      <input
        id="protocolInput"
        type="text"
        placeholder="Enter a protocol name or URL..."
      >

      <button onclick="analyzeProtocol()">
        Analyze
      </button>
    </div>
  </section>

  <div id="status"></div>

  <section id="result"></section>

</main>

<footer>
  Built by BOBOSYN
</footer>


<script>

const API_URL =
  "https://protocol-scout-api.superhelong.workers.dev/analyze";


// ==========================================
// Analyze
// ==========================================

async function analyzeProtocol() {

  const input =
    document.getElementById("protocolInput").value.trim();

  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");

  if (!input) {
    status.textContent =
      "Please enter a protocol name or URL.";

    return;
  }

  status.textContent =
    "Analyzing protocol...";

  result.innerHTML = "";

  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        protocol: input
      })

    });

    const data =
      await response.json();

    if (!data.success) {

      throw new Error(
        data.error ||
        "Analysis failed"
      );

    }

    renderResult(data);

    status.textContent = "";

  } catch (error) {

    status.textContent =
      "Error: " + error.message;

  }
}


// ==========================================
// Render
// ==========================================

function renderResult(data) {

  const protocol =
    data.protocol || {};

  const market =
    data.market || {};

  const metrics =
    data.metrics || {};

  const research =
    data.research || {};

  const risk =
    data.risk || {};


  document.getElementById("result").innerHTML = `

    <div class="protocol-header">

      <h2>
        ${escapeHtml(
          protocol.name || "Unknown Protocol"
        )}
      </h2>

      <p>
        ${escapeHtml(
          protocol.description ||
          "Web3 protocol research report."
        )}
      </p>

    </div>


    <!-- ================================== -->
    <!-- Overview -->
    <!-- ================================== -->

    <div class="section">

      <h3>Overview</h3>

      <div class="grid">

        ${card(
          "Category",
          protocol.category
        )}

        ${card(
          "Status",
          protocol.status
        )}

        ${websiteCard(
          "Website",
          protocol.website
        )}

        ${card(
          "Chains",
          Array.isArray(protocol.chains)
            ? protocol.chains.join(", ")
            : protocol.chains
        )}

      </div>

    </div>


    <!-- ================================== -->
    <!-- Market -->
    <!-- ================================== -->

    <div class="section">

      <h3>Market</h3>

      <div class="grid">

        ${bigCard(
          "TVL",
          formatMoney(market.tvl)
        )}

        ${bigCard(
          "Token",
          market.token || "N/A"
        )}

        ${bigCard(
          "Token Price",
          formatPrice(market.tokenPrice)
        )}

        ${changeCard(
          "24h Change",
          market.priceChange24h
        )}

      </div>

    </div>


    <!-- ================================== -->
    <!-- Protocol Metrics -->
    <!-- ================================== -->

    <div class="section">

      <h3>Protocol Metrics</h3>

      <div class="grid">

        ${bigCard(
          "Fees · 24h",
          formatMoney(metrics.fees24h)
        )}

        ${bigCard(
          "Fees · 7d",
          formatMoney(metrics.fees7d)
        )}

        ${bigCard(
          "Fees · 30d",
          formatMoney(metrics.fees30d)
        )}

        ${bigCard(
          "Revenue · 24h",
          formatMoney(metrics.revenue24h)
        )}

        ${bigCard(
          "Revenue · 7d",
          formatMoney(metrics.revenue7d)
        )}

        ${bigCard(
          "Revenue · 30d",
          formatMoney(metrics.revenue30d)
        )}

      </div>

    </div>


    <!-- ================================== -->
    <!-- Research -->
    <!-- ================================== -->

    <div class="section">

      <h3>Research</h3>

      <div class="grid">

        ${card(
          "Core Function",
          research.coreFunction
        )}

        ${card(
          "Mechanism",
          research.mechanism
        )}

        ${card(
          "Users",
          research.users
        )}

        ${card(
          "Revenue",
          research.revenue
        )}

      </div>

    </div>


    <!-- ================================== -->
    <!-- Risk -->
    <!-- ================================== -->

    <div class="section">

      <h3>Risk Snapshot</h3>

      <div class="grid">

        ${card(
          "Smart Contract",
          risk.smartContract
        )}

        ${card(
          "Protocol",
          risk.protocol
        )}

        ${card(
          "Token",
          risk.token
        )}

        ${card(
          "Dependencies",
          risk.dependencies
        )}

      </div>

    </div>

  `;
}


// ==========================================
// Cards
// ==========================================

function card(label, value) {

  return `
    <div class="card">

      <div class="label">
        ${escapeHtml(label)}
      </div>

      <div class="value">
        ${displayValue(value)}
      </div>

    </div>
  `;
}


function bigCard(label, value) {

  return `
    <div class="card">

      <div class="label">
        ${escapeHtml(label)}
      </div>

      <div class="value big-value">
        ${displayValue(value)}
      </div>

    </div>
  `;
}


function changeCard(label, value) {

  if (
    value === null ||
    value === undefined
  ) {

    return bigCard(
      label,
      "N/A"
    );

  }

  const number =
    Number(value);

  const formatted =
    number > 0
      ? "+" + number.toFixed(2) + "%"
      : number.toFixed(2) + "%";

  const className =
    number > 0
      ? "positive"
      : number < 0
        ? "negative"
        : "";

  return `
    <div class="card">

      <div class="label">
        ${escapeHtml(label)}
      </div>

      <div class="value big-value ${className}">
        ${formatted}
      </div>

    </div>
  `;
}


function websiteCard(label, url) {

  if (!url) {

    return card(
      label,
      "N/A"
    );

  }

  return `
    <div class="card">

      <div class="label">
        ${escapeHtml(label)}
      </div>

      <div class="value links">

        <a
          href="${escapeAttribute(url)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ${escapeHtml(url)}
        </a>

      </div>

    </div>
  `;
}


// ==========================================
// Formatting
// ==========================================

function displayValue(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return `
      <span class="pending">
        N/A
      </span>
    `;

  }

  return escapeHtml(
    String(value)
  );
}


function formatMoney(value) {

  if (
    value === null ||
    value === undefined ||
    isNaN(Number(value))
  ) {

    return "N/A";

  }

  const number =
    Number(value);

  if (Math.abs(number) >= 1e12) {

    return "$" +
      (number / 1e12).toFixed(2) +
      "T";

  }

  if (Math.abs(number) >= 1e9) {

    return "$" +
      (number / 1e9).toFixed(2) +
      "B";

  }

  if (Math.abs(number) >= 1e6) {

    return "$" +
      (number / 1e6).toFixed(2) +
      "M";

  }

  if (Math.abs(number) >= 1e3) {

    return "$" +
      (number / 1e3).toFixed(2) +
      "K";

  }

  return "$" +
    number.toFixed(2);
}


function formatPrice(value) {

  if (
    value === null ||
    value === undefined ||
    isNaN(Number(value))
  ) {

    return "N/A";

  }

  const number =
    Number(value);

  if (number < 0.01) {

    return "$" +
      number.toFixed(6);

  }

  if (number < 1) {

    return "$" +
      number.toFixed(4);

  }

  return "$" +
    number.toFixed(2);
}


// ==========================================
// Security helpers
// ==========================================

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}


// ==========================================
// Enter key
// ==========================================

document
  .getElementById("protocolInput")
  .addEventListener("keydown", event => {

    if (event.key === "Enter") {
      analyzeProtocol();
    }

  });

</script>

</body>
</html>
